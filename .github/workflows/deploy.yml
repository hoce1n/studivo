name: Deploy to Linux Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug SSH Secret
        run: |
          echo "===== LINE COUNT ====="
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | wc -l

          echo "===== FIRST LINE ====="
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | head -n 1

          echo "===== LAST LINE ====="
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tail -n 1

      - name: Write Key To File
        run: |
          cat > ssh_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF

          echo "===== FILE INFO ====="
          ls -lh ssh_key

          echo "===== FILE FIRST LINE ====="
          head -n 1 ssh_key

          echo "===== FILE LAST LINE ====="
          tail -n 1 ssh_key

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "SSH Connected Successfully"